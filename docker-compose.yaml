version: "3.0"

services:
  df2-server:
    build:
      context: .
      dockerfile: dev.Dockerfile
    environment:
        __DF_TEST_RUN: true
    expose:
      - "4201"
    ports:
     - "4201:4201"
    depends_on:
      - mysql
      - minio
      - memcache
    volumes:
      - ./src:/app/src
    healthcheck:
        test: [ "CMD", "curl", "-f", "localhost:4201/ping/" ]
        interval: 47s
        timeout: 13s
        retries: 2
        start_period: 40s
        start_interval: 5s
    #command: ["ls", "-al", "src"]
  mysql:
    image: mysql:8.0.33-debian
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
    expose: # exposes 3306 on the internal container network for the server
      - "3306"
    ports: # allows connection from integration tests, or an external mysql client.
      - "3306:3306"
  minio:
    image: quay.io/minio/minio:RELEASE.2023-05-18T00-05-36Z
    expose:
      - "9000"
    ports:
     - "9000:9000"
    command: ["server", "/data"]
  memcache:
    image: memcached:1.6.20-alpine3.18
    expose: # exposes 3306 on the internal container network for the server
      - "11211"
    ports:
      - "11211:11211"